version: '3.8'

services:

  app:
    build: .
    ports:
      - "2244:2244"
    depends_on:
      - mqtt
      - rabbitmq
      - db

  mqtt-broker:
    image: eclipse-mosquitto
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"